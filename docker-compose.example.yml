services:
  embedding-service:
    build: .
    container_name: embedding-service
    # Internal only: crm-ai-service reaches it on the Docker network. Do not
    # publish the port on a public interface.
    expose:
      - "8081"
    environment:
      APP_ENV: production
      EMBEDDING_MODEL_NAME: BAAI/bge-m3
      EMBEDDING_NORMALIZE: "true"
      EMBEDDING_DEVICE: cpu
      EMBEDDING_MAX_BATCH_SIZE: 64
      EMBEDDING_MAX_TEXT_LENGTH: 8000
      EMBEDDING_NUM_THREADS: 0
      # Required outside development: crm-ai-service sends it as EMBEDDING_API_KEY.
      API_KEY: ${API_KEY:?set API_KEY to a long random value}
      # Pin the Hugging Face revision of the model (a commit hash) so a new
      # upload cannot change embeddings under you.
      EMBEDDING_MODEL_REVISION: ${EMBEDDING_MODEL_REVISION:-}
    # Persist the Hugging Face model cache so restarts don't re-download ~2GB.
    volumes:
      - hf-cache:/home/appuser/.cache/huggingface
    restart: unless-stopped

volumes:
  hf-cache:
